packages:
  - packages/*

catalog:
  "@hyperjump/json-schema": ^1.17.8
  "@standard-schema/spec": ^1.1.0
  i18next: ^27.2.9
  rolldown: ^1.2.4
  rolldown-plugin-dts: ^0.28.2
  typescript: ^7.0.2
  vitest: ^5.1.2

overrides:
  # dpdm depends on glob ^13, which has no patched release. glob 14 keeps the glob() API dpdm uses.
  glob: ^14.0.2
  source-map-js: ^1.2.2
  vite: ^8.2.4

minimumReleaseAgeExclude:
  - source-map-js@1.2.4
  - vite@8.4.0
  - glob@14.0.6
  - minimatch@11.0.9

onlyBuiltDependencies:
  - rolldown
