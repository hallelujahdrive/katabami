name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: lts/*

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Pack packages
        run: |
          mkdir -p "${RUNNER_TEMP}/packs"
          pnpm --filter katabami pack --pack-destination "${RUNNER_TEMP}/packs"
          pnpm --filter @katabami/i18next pack --pack-destination "${RUNNER_TEMP}/packs"
          pnpm --filter @katabami/json-schema pack --pack-destination "${RUNNER_TEMP}/packs"

      - name: Install packed packages with npm
        run: |
          shopt -s nullglob
          katabami_tgz=("${RUNNER_TEMP}/packs"/katabami-[0-9]*.tgz)
          i18next_tgz=("${RUNNER_TEMP}/packs"/katabami-i18next-*.tgz)
          json_schema_tgz=("${RUNNER_TEMP}/packs"/katabami-json-schema-*.tgz)

          if [[ ${#katabami_tgz[@]} -ne 1 || ${#i18next_tgz[@]} -ne 1 || ${#json_schema_tgz[@]} -ne 1 ]]; then
            echo "expected one tarball per package" >&2
            ls -la "${RUNNER_TEMP}/packs"
            exit 1
          fi

          mkdir -p "${RUNNER_TEMP}/npm-install-check"
          cd "${RUNNER_TEMP}/npm-install-check"
          npm init --yes
          npm pkg set type=module
          npm install "${katabami_tgz[0]}" "${i18next_tgz[0]}" "${json_schema_tgz[0]}" i18next
          npm ls katabami @katabami/i18next @katabami/json-schema i18next

      - name: Import packed packages
        working-directory: ${{ runner.temp }}/npm-install-check
        run: |
          cat > smoke.mjs <<'EOF'
          import * as katabami from "katabami";
          import { createFormatter, formatter, resources } from "@katabami/i18next";
          import {
            toJsonSchema,
            toStandardJsonSchema,
          } from "@katabami/json-schema";
          import i18next from "i18next";

          const result = katabami.string().decodeValue("ok");
          if (!result.ok || result.value !== "ok") {
            throw new Error("katabami decode failed");
          }

          if (typeof createFormatter !== "function") {
            throw new Error("createFormatter is missing");
          }
          if (formatter?.type !== "formatter") {
            throw new Error("i18next formatter module is missing");
          }
          if (resources.en == null || resources.ja == null) {
            throw new Error("i18next resources are missing");
          }

          const format = createFormatter(i18next.t);
          if (typeof format !== "function") {
            throw new Error("createFormatter did not return a formatter");
          }

          const json = toJsonSchema(katabami.string(), { target: "draft-2020-12" });
          if (json.type !== "string") {
            throw new Error("toJsonSchema failed");
          }

          const standard = toStandardJsonSchema(katabami.string());
          const fromStandard = standard["~standard"].jsonSchema.input({
            target: "draft-07",
          });
          if (fromStandard.type !== "string") {
            throw new Error("toStandardJsonSchema failed");
          }

          console.log("npm install smoke test passed");
          EOF
          node smoke.mjs

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: lts/*

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: lts/*

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:test

      - name: Run tests
        run: pnpm run test -- --run

      - name: Run type tests
        run: pnpm run test:typecheck -- --run

  dpdm:
    name: Circular dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: lts/*

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check circular dependencies
        run: pnpm run dpdm

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: lts/*

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: lts/*

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format
